<h2 mat-dialog-title>Reset Price</h2>
<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
        <mat-form-field appearance="fill">
            <mat-label>New Price</mat-label>
            <input matInput type="number" formControlName="newPrice" required>
            <mat-error *ngIf="newPrice.hasError('required')">
                Price is required
            </mat-error>
            <mat-error *ngIf="newPrice.hasError('min')">
                Price must be greater than 0
            </mat-error>
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="!formGroup.valid">
            Submit
        </button>
    </mat-dialog-actions>
</form>
