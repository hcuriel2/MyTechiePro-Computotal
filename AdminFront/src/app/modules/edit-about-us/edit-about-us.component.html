<p class="textStyle">About Us</p>
<!-- Reminds the admin where this text shows up and what the limits are. -->
<p class="about-us-help">
  This text is shown in the About Us section on the client home page.
  Line breaks are kept. Maximum 5000 characters.
</p>
<!-- Stays on the page so loading and save results are not only in the snackbar. -->
<p class="about-us-status" role="status">{{ statusMessage }}</p>
<div class="about-us-container">
  <!-- Locked until Edit is clicked, and locked again while a save is in progress. -->
  <textarea
    [readonly]="!isEditing || isSaving"
    [(ngModel)]="aboutUsContent"
    rows="12"
    maxlength="5000"
    class="form-control about-us-textarea"
    placeholder="Write the About Us text visitors will see."
  ></textarea>
  <div class="edit-button-container">
    <button
      mat-raised-button
      color="primary"
      class="edit-button"
      [disabled]="isSaving"
      (click)="toggleEdit()"
    >
      {{ isSaving ? "Saving…" : isEditing ? "Save" : "Edit" }}
    </button>
  </div>
</div>
